name: tickethub
description: Multi-business ticketing and booking marketplace.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: 3.4.3
  go_router: 18.0.2
  supabase_flutter: 2.18.0
  qr_flutter: 4.1.0
  mobile_scanner: 7.4.2
  fl_chart: 1.2.0
  image_picker: 1.2.3
  cached_network_image: 4.0.4
  flutter_local_notifications: 22.3.1
  google_fonts: 8.2.1
  lucide_icons_flutter: 3.1.21
  intl: 0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0
  mocktail: 1.0.5

flutter:
  uses-material-design: true
