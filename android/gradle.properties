org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+UseSerialGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.daemon=true
org.gradle.caching=false
android.useAndroidX=true

# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# The project is on E: while Flutter plugins are cached on C:. Kotlin's
# relocatable incremental cache cannot safely relativize sources across drives.
kotlin.incremental=false

# Run the Kotlin compiler in its own daemon instead of inside the Gradle JVM.
# This keeps the Gradle heap smaller and reduces the chance of a native crash.
kotlin.compiler.execution.strategy=daemon
kotlin.daemon.jvmargs=-Xmx1536m